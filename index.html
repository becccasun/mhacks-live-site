<!doctype html>
<html lang="en" class="light" style="color-scheme: light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Timeline | MHacks 2026</title>

<body class="geist_a71539c9-module__T19VSG__variable geist_mono_8d43a2aa-module__8Li5zG__variable instrument_serif_bed06b21-module__swPsvG__variable instrument_sans_9efcdac8-module__gGJROW__variable red_hat_display_effa2217-module__Lg_oLW__variable red_hat_mono_b9a757e-module__5hERyq__variable antialiased">
  <main class="font-red-hat relative min-h-screen overflow-x-clip bg-paper text-ink">
    <!-- Floating tab bar: appears when the inline tabs are scrolled away and the user scrolls up -->
    <header id="floating-nav" aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-0 z-50 px-3 pt-3 sm:px-5 sm:pt-4">
      <div class="liquid-glass-edge bg-[#fbfaf4] shadow-e-3 mx-auto max-w-5xl overflow-hidden rounded-md border-white/50 bg-paper/85 px-2 shadow-[0_10px_34px_rgba(29,36,18,0.14)] backdrop-blur-xl">
        <div data-tabs="floating" aria-label="Floating live page views" role="tablist" class="flex w-full min-w-0 justify-between gap-2 overflow-x-clip sm:gap-10 px-1 sm:justify-center sm:px-2"></div>
      </div>
    </header>

    <!-- Hero: looping carousel of MHacks bouquet stickers -->
    <section class="sticker-hero" aria-label="MHacks flower bouquet stickers">
      <div class="sticker-track" id="sticker-track"></div>
    </section>

    <section class="relative">
      <div class="relative mx-auto flex max-w-5xl flex-col gap-6 px-5 pt-8 pb-10 sm:px-8 sm:pt-10 sm:pb-12 lg:flex-row lg:items-end lg:justify-between">
        <div class="max-w-2xl">
          <h1 id="hero-title" class="font-red-hat text-5xl font-black uppercase leading-[0.95] tracking-tight text-ink sm:text-7xl"></h1>
          <p id="hero-description" class="font-red-hat mt-3 max-w-xl text-lg font-medium leading-7 text-ink/75 sm:text-xl"></p>
        </div>
        <div class="flex flex-col items-start gap-3 lg:items-end">
          <div id="date-range" class="liquid-glass-edge liquid-glass-surface shadow-e-2 liquid-glass-surface-strong font-red-hat inline-flex w-fit items-center gap-2.5 rounded-md border-olive/15 bg-paper/90 px-4 py-2 text-base text-olive shadow-[0_10px_30px_-14px_rgba(31,42,22,0.45)]"></div>
          <div id="countdown" hidden class="liquid-glass-edge liquid-glass-surface shadow-e-2 liquid-glass-surface-strong inline-flex w-fit items-center gap-3 rounded-md border-olive/15 bg-paper/90 px-4 py-2 shadow-[0_10px_30px_-14px_rgba(31,42,22,0.45)]">
            <span id="countdown-label" class="font-red-hat text-[10px] font-bold uppercase tracking-[0.18em] text-olive/85"></span>
            <span id="countdown-value" class="font-red-hat text-base text-olive tabular-nums sm:text-lg"></span>
          </div>
          <button id="add-flower" type="button" class="font-red-hat inline-flex w-fit items-center gap-2.5 rounded-md bg-olive px-4 py-2 text-base font-semibold text-cream shadow-[0_1px_0_rgba(255,255,255,0.30)_inset,0_6px_16px_-4px_rgba(31,42,22,0.50)] transition-transform duration-200 hover:-translate-y-0.5"></button>
        </div>
      </div>
    </section>

    <section class="relative mx-auto max-w-5xl px-5 pb-20 sm:px-8">
      <div class="space-y-6 sm:space-y-8">
        <nav id="quick-links" aria-label="Quick links" class="flex flex-wrap gap-2"></nav>
        <div id="inline-tabs-anchor">
          <div data-tabs="inline" aria-label="Live page views" role="tablist" class="flex w-full min-w-0 justify-between gap-2 overflow-x-clip sm:justify-start sm:gap-10 border-b border-olive/15"></div>
        </div>
        <div id="panel"></div>
      </div>
    </section>
  </main>

  <div id="drawer-root"></div>
  <div id="toast" role="status" aria-live="polite" class="live-toast font-red-hat"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</html>
